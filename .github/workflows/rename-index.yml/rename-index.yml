name: Rename recruiter-website.html to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename recruiter-website.html to index.html
        run: |
          git mv recruiter-website.html index.html || { mv -f recruiter-website.html index.html && git add -A; }
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Rename recruiter-website.html to index.html"
          git push

