name: Rename to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html
        run: |
          mv recruiter-website.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html recruiter-website.html
          git commit -m "Make DD look exactly like Muse avatar, free-standing, hammock walk" || exit 0
          git push
