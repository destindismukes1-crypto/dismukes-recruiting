name: Rename temp build to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move recruiter-website.html to index.html
        run: |
          test -f recruiter-website.html
          mv recruiter-website.html index.html
          ls -lh index.html
          git status --short
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html recruiter-website.html
          git diff --cached --quiet || git commit -m "Publish new site build as index.html"
          git push

