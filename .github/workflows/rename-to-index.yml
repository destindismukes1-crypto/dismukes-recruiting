name: Publish newest build as index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy temp build to index.html
        run: |
          cp recruiter-website.html index.html
          git config user.name "destindismukes1-crypto"
          git config user.email "destindismukes1-crypto@users.noreply.github.com"
          git add index.html
          git commit -m "Publish newest build as index.html" || echo "No changes to commit"
          git push
