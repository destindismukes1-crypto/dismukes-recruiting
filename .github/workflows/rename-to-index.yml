name: Rename to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename temporary file to index.html
        run: |
          ls -l recruiter-website.html
          mv recruiter-website.html index.html
          git config user.name "destindismukes1-crypto"
          git config user.email "destindismukes1-crypto@users.noreply.github.com"
          git add index.html recruiter-website.html
          git commit -m "Full-body DD with legs, 2015 pearl lifted Silverado with Alabama A, Site Song Set the Book Down"
          git push
