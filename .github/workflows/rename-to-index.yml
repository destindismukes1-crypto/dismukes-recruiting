name: Rename to index
on:
  push:
    paths:
      - .github/workflows/rename-to-index.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename temporary file to index.html
        run: |
          mv recruiter-website.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish newest Recruiter Website as index.html" || echo "No changes to commit"
          git push
