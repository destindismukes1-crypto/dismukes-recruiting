name: Rename to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename files
        run: |
          mv recruiter-website.html index.html
          mv media-generation-dismukes-recruiting-fourwheele-0-1d96a877-5f63-44e7-bfda-502de84a6390.mp4 fourwheeler-video.mp4
          ls -l
      - name: Commit renamed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Publish updated build as index.html with fourwheeler-video.mp4" || echo "nothing to commit"
          git push
