name: Rename to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename recruiter file to index.html
        run: |
          ls -lh recruiter-website.html
          mv -f recruiter-website.html index.html
          ls -lh index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Publish newest Recruiter Website as index.html" || echo "Nothing to commit"
          git push
