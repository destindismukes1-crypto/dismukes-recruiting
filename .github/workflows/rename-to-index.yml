name: Rename to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move temp build to index.html
        run: |
          mv recruiter-website.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html recruiter-website.html
          git commit -m "Publish newest build as index.html" || echo "Nothing to commit"
          git push
