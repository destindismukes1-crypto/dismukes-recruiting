name: Rename to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename temporary file to index.html
        run: |
          ls -l recruiter-website.html
          mv -f recruiter-website.html index.html
          ls -l index.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish newest Recruiter Website as index.html" || echo "No changes to commit"
          git push
