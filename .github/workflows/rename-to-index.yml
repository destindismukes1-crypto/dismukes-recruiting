name: Rename temp file to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename recruiter-website.html to index.html
        run: |
          mv recruiter-website.html index.html
          git config user.name "destindismukes1-crypto"
          git config user.email "destindismukes1-crypto@users.noreply.github.com"
          git add -A
          git commit -m "Add Mini Destin avatar guide"
          git push
