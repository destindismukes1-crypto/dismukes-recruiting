name: Rename temp file to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename recruiter-website.html to index.html
        run: |
          mv recruiter-website.html index.html
          ls -lh index.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish new site as index.html" || echo "Nothing to commit"
          git push
