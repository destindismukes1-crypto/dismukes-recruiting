name: Publish newest build as index.html
on:
  push:
    paths:
      - 'recruiter-website.html'
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy newest build to index.html
        run: |
          cp recruiter-website.html index.html
          ls -lh index.html recruiter-website.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Publish newest build as index.html"
          git push
