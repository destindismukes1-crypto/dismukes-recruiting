name: Publish newest build as index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy recruiter-website.html to index.html
        run: |
          cp recruiter-website.html index.html
          ls -l index.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish newest build as index.html" || echo "No changes to commit"
          git push
