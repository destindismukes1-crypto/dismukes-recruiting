name: Rename temporary file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with temporary file
        run: |
          mv recruiter-website.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html recruiter-website.html
          git commit -m "Add 3D talking DD guide, one side, Brainstorm Ideas panel" || exit 0
          git push
